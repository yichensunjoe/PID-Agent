name: Apply dialog E2E migration

on:
  push:
    branches: [agent/fix-browser-state-vision]
    paths:
      - ".agentcad/fix-e2e.py"
      - ".github/workflows/agent-fix-e2e.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-browser-state-vision
          fetch-depth: 0
      - run: |
          python .agentcad/fix-e2e.py
          rm -f .agentcad/fix-e2e.py .github/workflows/agent-fix-e2e.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: migrate browser flows to input dialog"
          git push origin HEAD:agent/fix-browser-state-vision
